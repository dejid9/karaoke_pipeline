name: Build Android APK (Karaoke Mobile)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]>=1.0.5" "flet-audio>=1.0.5"

      - name: Build Android APK
        working-directory: karaoke_mobile
        run: |
          flet build apk src -o build/apk --project KaraokeMobile --arch arm64-v8a --yes --no-rich-output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaraokeMobile-APK
          path: karaoke_mobile/build/apk/*.apk
          retention-days: 14

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: karaoke_mobile/build/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
