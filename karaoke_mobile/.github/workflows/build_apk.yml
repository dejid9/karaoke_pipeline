name: Build Android APK (Karaoke Mobile)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet[all]
          pip install -r karaoke_mobile/requirements.txt

      - name: Build Android APK with Flet
        working-directory: karaoke_mobile
        run: |
          # Build signed/release APK
          flet build apk --project src --output build/apk --no-rich-output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaraokeMobile-APK
          path: karaoke_mobile/build/apk/*.apk
          retention-days: 14

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: karaoke_mobile/build/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
