name: Build Android APK (Karaoke Mobile)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]>=1.0.5" "flet-audio>=1.0.5"

      - name: Configure Gradle and pre-fetch bridge binaries
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/gradle.properties
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m
          EOF

          python - << 'EOF'
          import os, pathlib, urllib.request
          from flet_cli.utils.python_versions import get_default_python_version

          bridge_dir = pathlib.Path("${{ runner.temp }}/dart_bridge")
          bridge_dir.mkdir(parents=True, exist_ok=True)
          version = "1.10.0"
          try:
              py_ver = get_default_python_version()
          except Exception:
              py_ver = "3.14"

          print(f"Target python version for dart-bridge: {py_ver}")
          for abi in ["arm64-v8a", "armeabi-v7a", "x86_64"]:
              filename = f"libdart_bridge-android-{abi}-py{py_ver}.so"
              url = f"https://github.com/flet-dev/dart-bridge/releases/download/v{version}/{filename}"
              dest = bridge_dir / filename
              print(f"Pre-fetching {filename}...")
              urllib.request.urlretrieve(url, dest)
              print(f"-> Saved {dest} ({dest.stat().st_size} bytes)")
          EOF

      - name: Build Android APK
        working-directory: karaoke_mobile
        env:
          SERIOUS_PYTHON_DART_BRIDGE_DIST: ${{ runner.temp }}/dart_bridge
          GRADLE_OPTS: "-Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1"
        run: |
          flet build apk src -o build/apk --project KaraokeMobile --arch arm64-v8a --android-permissions android.permission.READ_EXTERNAL_STORAGE=true android.permission.READ_MEDIA_AUDIO=true --yes --no-rich-output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaraokeMobile-APK
          path: karaoke_mobile/build/apk/*.apk
          retention-days: 14

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: karaoke_mobile/build/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
