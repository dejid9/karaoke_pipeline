name: Desktop CI & Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'karaoke_core/**'
      - 'karaoke_gui/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/desktop_ci.yml'
  pull_request:
    paths:
      - 'karaoke_core/**'
      - 'karaoke_gui/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/desktop_ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (ffmpeg, xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy langdetect pyphen Pillow

      - name: Run Python unit tests with xvfb
        run: |
          xvfb-run -a python -m pytest tests/
